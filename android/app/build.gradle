plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (!keystorePropertiesFile.exists()) {
    throw new GradleException("Falta android/key.properties para firmar release.")
}
keystorePropertiesFile.withInputStream { stream ->
    keystoreProperties.load(stream)
}
["storePassword", "keyPassword", "keyAlias", "storeFile"].each { propertyName ->
    if (!keystoreProperties[propertyName]) {
        throw new GradleException("Falta la propiedad " + propertyName + " en android/key.properties.")
    }
}


android {
    namespace = "com.davidlledo.trueke"
    compileSdk flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.davidlledo.trueke"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 17
        versionName "1.0.17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}
