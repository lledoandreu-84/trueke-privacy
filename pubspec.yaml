name: trueke
description: Plataforma de compraventa e intercambio.
publish_to: "none"

version: 1.0.0+100


environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.3
  flutter_dotenv: ^6.0.1
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  http: ^1.6.0
  google_maps_flutter: ^2.18.1
  app_links: ^6.3.5
  cross_file: ^0.3.5+5
  url_launcher: ^6.3.3
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_native_splash: ^2.4.3
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/legal/
    - .env
    - assets/images/


flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/launcher/splash_icon.png"
  android: true
  ios: true
  fullscreen: true
